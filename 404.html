<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Fredoka:wght@600;700&amp;display=swap">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F7E4D3;color:#2B2A33;font-family:"Fredoka",sans-serif;text-align:center;padding:20px;box-sizing:border-box}
.card{background:#FFF9EF;border:3px solid #2B2A33;border-radius:22px;box-shadow:6px 6px 0 #2B2A33;padding:36px 40px;max-width:440px}
h1{margin:0;font-size:64px}
p{font:700 26px "Caveat",cursive;margin:8px 0 22px}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border:2.5px solid #2B2A33;border-radius:999px;background:#2B2A33;color:#FFF6EA;text-decoration:none;box-shadow:3px 3px 0 #2B2A33}
</style>
</head>
<body>
<div class="card"><h1>404</h1><p>this page fell off the desk</p><a id="home" href="/">Back to desk</a></div>
<script>
// Works for both user sites (user.github.io/) and project sites (user.github.io/repo/).
var first = location.pathname.split('/').filter(Boolean)[0];
if (first) fetch('/' + first + '/assets/desk-scene.js', { method: 'HEAD' }).then(function (r) { if (r.ok) document.getElementById('home').href = '/' + first + '/'; });
</script>
</body>
</html>
